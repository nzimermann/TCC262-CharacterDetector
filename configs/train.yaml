# Hiperparâmetros do treino completo.
# Usado por src/training/train.py quando NÃO está em modo smoke test.
#
# imgsz=640 (o padrão do YOLO, diferente do imgsz=960 usado no projeto
# PlateDetector): o EDA (outputs/reports/eda_summary.md) mediu o caractere
# ocupando mediana de ~12.5% da largura x ~35% da altura da imagem - nada
# de objeto pequeno, ao contrário da placa no outro projeto (~0.3% da
# área). Além disso todas as imagens já vêm fixas em 640x640 (stretch do
# Roboflow) - treinar acima disso só faria upscale sintético, sem ganhar
# detalhe real.
#
# batch=64 (maior que o batch=16 do PlateDetector): com imgsz menor
# (640 vs 960) cabe mais imagem por lote na mesma GPU. train.py treina com
# DDP em todas as GPUs visíveis quando há mais de uma (ex.: "GPU T4 x2" do
# Kaggle) - esse batch é o TOTAL, dividido entre as GPUs (64 = 32 por GPU
# em duas T4), não o batch de cada uma. Em uma única GPU, 64 ainda deve
# caber tranquilo num T4/P100 nesse imgsz, mas meça o uso de VRAM no smoke
# test antes de confirmar (ver notebooks/kaggle_train.ipynb) e ajuste se
# sobrar ou faltar memória.
#
# epochs=80: mesmo teto do PlateDetector, mas por um motivo diferente aqui -
# reduzido de 100 depois que uma sessão do Kaggle não terminou 100 dentro
# das ~12h da sessão. `patience` faz early stopping se não houver ganho,
# então 80 é só o teto.
#
# Caminho relativo à raiz do repo (src/training/train.py resolve como
# REPO_ROOT / model) - não ao diretório de onde o script é chamado.
model: weights/yolo11n.pt
imgsz: 640
epochs: 80
batch: 64
patience: 20
save_period: 10
name: full_run
